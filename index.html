<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mohammed Almonzer & Eman · 27.10.2026</title>
  <meta name="description" content="Tuesday 27 October 2026 · 8:00 PM · Tia Vie, Cairo — الثلاثاء ٢٧ أكتوبر ٢٠٢٦ · تيا ڤي، القاهرة" />
  <meta name="theme-color" content="#23271a" />

  <!-- Link preview (WhatsApp, iMessage, Telegram, X). Absolute URLs: update if the domain changes. -->
  <meta property="og:title" content="Mohammed Almonzer & Eman · محمد المنذر وإيمان" />
  <meta property="og:description" content="Tuesday 27 Oct 2026 · 8:00 PM · Tia Vie, Cairo" />
  <meta property="og:url" content="https://monzeremaninvitation.vercel.app/" />
  <meta property="og:image" content="https://monzeremaninvitation.vercel.app/og-bloom.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://monzeremaninvitation.vercel.app/og-bloom.jpg" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="is-intro">

  <!-- ═══ 0 · The envelope: tap to open ═══ -->
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the invitation · افتح الدعوة">
    <div class="env-scene">
      <p class="env-kicker"><span>You are invited</span><span lang="ar" dir="rtl">أنتم مدعوون</span></p>
      <div class="env">
        <!-- the paper parts; they fade together as one piece at the end -->
        <div class="env-body">
          <div class="env-back"></div>
          <div class="env-card" aria-hidden="true">
            <span class="env-card-mark">M<i>&amp;</i>E</span>
            <span class="env-card-date" dir="ltr">27 · 10 · 2026</span>
          </div>
          <div class="env-pocket"></div>
          <div class="env-flap"></div>
          <div class="env-flora" data-flora="branch:31" aria-hidden="true"></div>
          <span class="env-seal" aria-hidden="true"><span>M<i>&amp;</i>E</span></span>
        </div>
        <!-- loose lilies, blossoms and leaves: they rise from behind the card as it opens -->
        <div class="env-burst" data-flora="burst:5" aria-hidden="true"></div>
      </div>
      <p class="env-hint"><span>Tap to open</span><span lang="ar" dir="rtl">اضغط لفتح الدعوة</span></p>
    </div>
  </div>

  <!-- Fixed, minimal chrome -->
  <header class="chrome" data-tone="light">
    <a class="chrome-mark" href="#top" aria-label="Mohammed Almonzer & Eman">M<i>&amp;</i>E</a>
    <div class="chrome-actions">
      <button class="chrome-btn" id="soundBtn" type="button" aria-pressed="false">
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span data-i18n="ui.sound"></span>
      </button>
      <button class="chrome-btn" id="langBtn" type="button" data-i18n="ui.lang"></button>
    </div>
  </header>

  <main>
    <!-- ═══ 1 · Opening ═══ -->
    <section class="hero" id="top" data-tone="dark">
      <div class="hero-stage">
        <div class="hero-flora hero-flora--tl" data-flora="cascade:3:1.35"></div>
        <div class="hero-flora hero-flora--tr" data-flora="cascade:8:1.35"></div>
        <div class="hero-flora hero-flora--bl" data-flora="spray:7"></div>
        <div class="hero-flora hero-flora--br" data-flora="spray:12"></div>
      </div>

      <div class="hero-copy">
        <p class="hero-kicker" data-i18n="hero.kicker"></p>
        <h1 class="names" data-names>
          <span class="names-groom"><span class="names-line names-first" data-i18n="hero.first"></span> <span class="names-line names-second" data-i18n="hero.second"></span></span>
          <span class="names-line names-amp" data-i18n="hero.and"></span>
          <span class="names-line names-bride" data-i18n="hero.bride"></span>
        </h1>
        <div class="hero-rule" aria-hidden="true"></div>
      </div>

      <div class="scroll-cue" aria-hidden="true">
        <span data-i18n="ui.scroll"></span>
        <i class="scroll-cue-line"></i>
      </div>
    </section>

    <!-- ═══ Bismillah: the verse from the printed invitation ═══ -->
    <section class="faith" id="faith" data-tone="light">
      <p class="faith-basmala" data-fade lang="ar" dir="rtl" data-i18n="faith.basmala"></p>
      <div class="faith-rule" data-fade aria-hidden="true"></div>
      <p class="faith-verse" data-fade lang="ar" dir="rtl" data-i18n="faith.verse"></p>
      <p class="faith-translation" data-fade data-i18n="faith.translation"></p>
      <p class="faith-ref" data-fade data-i18n="faith.ref"></p>
    </section>

    <!-- ═══ 2 · Prologue: photographic story ═══ -->
    <section class="story" id="story" data-tone="dark">
      <p class="chapter" data-i18n="story.chapter"></p>
      <div class="story-stage">
        <figure class="story-a" data-reveal-clip>
          <picture>
            <source srcset="/images/lilies-side.webp" type="image/webp" />
            <img src="/images/lilies-side.jpg" width="960" height="1408" alt="" loading="lazy" decoding="async" />
          </picture>
        </figure>
        <figure class="story-b" data-parallax="-18">
          <picture>
            <source srcset="/images/lilies-top.webp" type="image/webp" />
            <img src="/images/lilies-top.jpg" width="780" height="1196" alt="" loading="lazy" decoding="async" />
          </picture>
        </figure>
        <h2 class="story-title">
          <span class="story-line" data-parallax="5" data-i18n="story.line1"></span>
          <span class="story-line story-line--em" data-parallax="-5" data-i18n="story.line2"></span>
        </h2>
        <p class="story-caption" data-fade data-i18n="story.caption"></p>
      </div>
    </section>

    <!-- ═══ 3 · The invitation (words light up as you read) ═══ -->
    <section class="invite" id="invitation" data-tone="dark">
      <p class="chapter" data-i18n="invite.chapter"></p>
      <p class="invite-honour" data-fade data-i18n="invite.honour"></p>
      <ul class="families">
        <li data-fade data-i18n="invite.f1"></li>
        <li data-fade data-i18n="invite.f2"></li>
        <li data-fade data-i18n="invite.f3"></li>
        <li data-fade data-i18n="invite.f4"></li>
      </ul>
      <p class="invite-text" data-words data-i18n="invite.text"></p>
      <p class="invite-couple" data-fade>
        <span class="invite-groom" data-i18n="invite.groom"></span>
        <span class="invite-and" data-i18n="invite.and"></span>
        <span class="invite-bride" data-i18n="invite.bride"></span>
      </p>
      <p class="invite-when" data-fade data-i18n="invite.when"></p>
      <div class="invite-leaf" data-parallax="-24" aria-hidden="true" data-flora="branch:31"></div>
    </section>

    <!-- ═══ 4 · The evening ═══ -->
    <section class="evening" id="evening" data-tone="dark">
      <p class="chapter" data-i18n="eve.chapter"></p>
      <div class="eve-grid">
        <p class="eve-day" data-fade data-i18n="eve.day"></p>
        <p class="eve-num" aria-label="27"><span data-count="27">27</span></p>
        <p class="eve-month" data-fade><span data-i18n="eve.month"></span> <span data-i18n="eve.year"></span></p>
        <p class="eve-time" data-fade data-i18n="eve.time"></p>
      </div>
      <div class="countdown" data-fade>
        <div class="cd-unit"><b data-cd="days">00</b><span data-i18n="eve.days"></span></div>
        <div class="cd-unit"><b data-cd="hours">00</b><span data-i18n="eve.hours"></span></div>
        <div class="cd-unit"><b data-cd="minutes">00</b><span data-i18n="eve.minutes"></span></div>
        <p class="cd-until" data-i18n="eve.until"></p>
      </div>
    </section>

    <!-- ═══ 5 · Venue reveal (sticky) ═══ -->
    <section class="venue" id="venue" data-tone="light">
      <div class="venue-sticky">
        <div class="venue-window">
          <picture>
            <!-- a portrait painting for phones, the wide one for larger screens -->
            <source media="(max-width: 899px)" srcset="/images/lilies-low-tall.webp" type="image/webp" />
            <source media="(max-width: 899px)" srcset="/images/lilies-low-tall.jpg" type="image/jpeg" />
            <source srcset="/images/lilies-low.webp" type="image/webp" />
            <img class="venue-img" src="/images/lilies-low.jpg" width="2000" height="2000" alt="" loading="lazy" decoding="async" />
          </picture>
          <div class="venue-shade" aria-hidden="true"></div>
        </div>
        <div class="venue-copy">
          <p class="chapter chapter--light" data-i18n="venue.chapter"></p>
          <h2 class="venue-name" data-i18n="venue.name"></h2>
          <p class="venue-place" data-i18n="venue.place"></p>
          <nav class="venue-links">
            <a id="mapsLink" target="_blank" rel="noopener"><span data-i18n="venue.directions"></span><i aria-hidden="true">↗</i></a>
            <a id="gcalLink" target="_blank" rel="noopener"><span data-i18n="venue.google"></span><i aria-hidden="true">↗</i></a>
            <a href="/wedding.ics"><span data-i18n="venue.apple"></span><i aria-hidden="true">↓</i></a>
          </nav>
        </div>
      </div>
    </section>

    <!-- ═══ 6 · The order of the evening ═══ -->
    <section class="schedule" id="schedule" data-tone="light">
      <p class="chapter chapter--light" data-i18n="sched.chapter"></p>
      <ol class="sched-list"></ol>
    </section>

    <!-- ═══ 7 · In print ═══ -->
    <section class="interlude" id="bloom" data-tone="dark" aria-hidden="true">
      <div class="interlude-curtain" data-flora="curtain:11"></div>
      <div class="interlude-bouquet" data-flora="bouquet:21"></div>
    </section>

    <!-- ═══ 8 · A word from you ═══ -->
    <section class="note" id="note" data-tone="dark">
      <p class="chapter" data-i18n="msg.chapter"></p>
      <h2 class="note-title" data-fade data-i18n="msg.title"></h2>
      <p class="note-lead" data-fade data-i18n="msg.lead"></p>
      <form class="note-form" id="noteForm" novalidate>
        <label class="field">
          <span data-i18n="msg.name"></span>
          <input name="name" type="text" maxlength="80" autocomplete="name" required />
        </label>
        <label class="field">
          <span data-i18n="msg.message"></span>
          <textarea name="message" rows="4" maxlength="1000" required></textarea>
        </label>
        <div class="note-actions">
          <p class="note-status" role="status" aria-live="polite"></p>
          <button class="note-send" type="submit"><span data-i18n="msg.send"></span><i aria-hidden="true">→</i></button>
        </div>
      </form>
      <div class="note-thanks" hidden>
        <p class="note-thanks-title"></p>
        <p class="note-thanks-sub" data-i18n="msg.thanksSub"></p>
      </div>
    </section>

    <!-- ═══ 9 · Closing ═══ -->
    <section class="ending" id="ending" data-tone="light">
      <div class="ending-flora ending-flora--tl" data-flora="cascade:17"></div>
      <div class="ending-flora ending-flora--tr" data-flora="cascade:23"></div>
      <div class="ending-flora ending-flora--b" data-flora="bouquet:29"></div>
      <div class="ending-copy">
        <p class="ending-names" aria-label="Mohammed Almonzer & Eman">
          <span class="ending-line" data-i18n="hero.first"></span>
          <span class="ending-line" data-i18n="hero.second"></span>
          <span class="ending-line ending-amp" data-i18n="hero.and"></span>
          <span class="ending-line" data-i18n="hero.bride"></span>
        </p>
        <p class="ending-tag" data-i18n="end.line"></p>
        <p class="ending-sign"><span data-i18n="end.sign"></span> · 27.10.2026</p>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
